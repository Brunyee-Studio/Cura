name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, `vX.Y.Z`. The `vX` major tag is moved to it.
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Validate version
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must look like v1.2.3 (got '$VERSION')."
            exit 1
          fi
          # Moving the major tag re-points every consumer on it, so only the
          # default branch is released.
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release from main (dispatched on $GITHUB_REF)."
            exit 1
          fi
          echo "major=${VERSION%%.*}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.14.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

      - name: Tag
        env:
          VERSION: ${{ inputs.version }}
          MAJOR: ${{ steps.version.outputs.major }}
        run: |
          set -euo pipefail
          if git rev-parse --quiet --verify "refs/tags/$VERSION" >/dev/null; then
            echo "::error::Tag $VERSION already exists."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "$VERSION"
          git tag -fa "$MAJOR" -m "$MAJOR → $VERSION"
          git push origin "refs/tags/$VERSION"
          git push --force origin "refs/tags/$MAJOR"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: gh release create "$VERSION" --verify-tag --generate-notes --title "$VERSION"
