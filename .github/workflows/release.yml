name: Release

# Every push to main is released by semantic-release from its conventional
# commits: `fix` → patch, `feat` → minor, `!`/`BREAKING CHANGE` → major, and
# anything else releases nothing. It pushes the `vX.Y.Z` tag and the GitHub
# release; this workflow then moves the `vX` major tag onto it. Releases are
# immutable, so a `vX.Y.Z` tag never moves once published.
# Dispatch it by hand to retry a release that failed after its checks.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # The dev dependencies run here, without write access. Only the release job
  # holds a token that can push tags, and it runs only semantic-release and the
  # major tag move.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check branch
        run: |
          # Moving the major tag re-points every consumer on it, so only the
          # default branch is released.
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release from main (dispatched on $GITHUB_REF)."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.34.7
      # No dependency cache (another job's cache must not reach the write token)
      # and no install scripts.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Semantic release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm exec semantic-release

      - name: Move major tag
        run: |
          set -euo pipefail
          # Point it at the highest release, not at a tag on HEAD, so a re-run
          # of an older push can never move it backwards.
          VERSION=$(git tag --list 'v*.*.*' | sort -V | tail -n1)
          MAJOR=${VERSION%%.*}
          TARGET=$(git rev-parse "$VERSION^{}")
          if [[ "$(git rev-parse -q --verify "$MAJOR^{}")" == "$TARGET" ]]; then
            echo "$MAJOR already points at $VERSION."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "$MAJOR" -m "$MAJOR → $VERSION" "$VERSION^{}"
          git push --force origin "refs/tags/$MAJOR"
          echo "Moved $MAJOR to $VERSION."
