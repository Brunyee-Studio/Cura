# Copy to .github/workflows/cura.yml and add the repository secret
# CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`).
name: Cura

on:
  pull_request:
    # Review when a PR opens and on each push; `edited` re-reviews only when
    # the base branch changes (the reusable workflow skips title/body edits).
    types: [opened, reopened, ready_for_review, synchronize, edited]
  # A `/cura` PR comment from a repo member re-runs the review.
  issue_comment:
    types: [created]

jobs:
  review:
    # The called workflow's token can't have more than the caller grants.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    uses: Brunyee-Studio/cura/.github/workflows/review.yml@v1
    # Every input is optional; the defaults are shown.
    # with:
    #   runs_on: ubuntu-latest
    #   rules: .opencodereview/rule.json
    #   config: .github/cura.json
    #   model: claude-opus-5-5
    #   fail_on: none
    #   max_files_per_scope: 12
    #   max_lines_per_scope: 1500
    #   timeout_minutes: 45
    #   allowed_bots: ''
    #   allow_forks: false
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

